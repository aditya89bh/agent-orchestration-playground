[project]
name = "agent-orchestration-playground"
version = "0.1.0"
description = "Deterministic commander-worker multi-agent orchestration playground."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aditya" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
redis = [
  "redis>=5.0.0"
]
postgres = [
  "psycopg[binary]>=3.2.0"
]

[project.scripts]
agent-swarm = "orchestration.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
